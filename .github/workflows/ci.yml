name: API Test CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=user_center_testdev
          DB_USER=user_center_app
          DB_PASSWORD=ci_app_password
          JWT_SECRET_KEY=ci-jwt-secret-key-for-testing-only
          MYSQL_ROOT_PASSWORD=ci_root_password
          TEST_DB_HOST=127.0.0.1
          TEST_DB_PORT=3307
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for MySQL initialization
        run: |
          for i in {1..30}; do
            if docker compose exec -T mysql sh -c \
              'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1;"'; then
              echo "MySQL schema is ready."
              exit 0
            fi

            echo "Waiting for MySQL initialization..."
            sleep 2
          done

          echo "MySQL initialization failed."
          docker compose logs --no-color mysql
          exit 1

      - name: Wait for application health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become healthy."
          docker compose logs --no-color
          exit 1

      - name: Run pytest
        run: python -m pytest -v

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v


  build-image:
    needs: api-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set GHCR image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"