name: API Test CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=user_center_testdev
          DB_USER=user_center_app
          DB_PASSWORD=ci_app_password
          JWT_SECRET_KEY=ci-jwt-secret-key-for-testing-only
          MYSQL_ROOT_PASSWORD=ci_root_password
          TEST_DB_HOST=127.0.0.1
          TEST_DB_PORT=3307
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for MySQL initialization
        run: |
          for i in {1..30}; do
            if docker compose exec -T mysql sh -c \
              'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1;"'; then
              echo "MySQL schema is ready."
              exit 0
            fi

            echo "Waiting for MySQL initialization..."
            sleep 2
          done

          echo "MySQL initialization failed."
          docker compose logs --no-color mysql
          exit 1

      - name: Wait for application health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become healthy."
          docker compose logs --no-color
          exit 1

      - name: Run pytest
        run: python -m pytest -v

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v

  build-image:
    needs: api-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set GHCR image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

  deploy:
    needs: build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64
      - local-cd

    steps:
      - name: Ensure Ubuntu WSL is running
        shell: powershell
        run: |
          Start-Process `
            -FilePath "wsl.exe" `
            -ArgumentList "-d", "Ubuntu-24.04", "--exec", "sleep", "infinity" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          wsl -l -v

      - name: Wait for SSH connection
        shell: powershell
        run: |
          $sshKey = "$env:USERPROFILE\.ssh\user_center_cd_ed25519"

          for ($i = 1; $i -le 15; $i++) {
              ssh `
                -i $sshKey `
                -o BatchMode=yes `
                -o ConnectTimeout=5 `
                -o StrictHostKeyChecking=accept-new `
                xkh@localhost `
                "echo SSH_READY"

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Ubuntu SSH is ready."
                  exit 0
              }

              Write-Host "Waiting for Ubuntu SSH... attempt $i/15"
              Start-Sleep -Seconds 2
          }

          throw "Ubuntu SSH did not become ready."

      - name: Deploy commit image
        shell: powershell
        run: |
          $sshKey = "$env:USERPROFILE\.ssh\user_center_cd_ed25519"
          $sha = "${{ github.sha }}"

          Write-Host "Deploying commit:"
          Write-Host $sha

          ssh `
            -i $sshKey `
            -o BatchMode=yes `
            xkh@localhost `
            "cd ~/user-center-deploy && ./deploy.sh $sha"

          if ($LASTEXITCODE -ne 0) {
              throw "Remote deployment failed."
          }

      - name: Verify deployed version
        shell: powershell
        run: |
          $sshKey = "$env:USERPROFILE\.ssh\user_center_cd_ed25519"
          $expectedImage = "ghcr.io/whitedog628/user-center-testdev:${{ github.sha }}"

          $actualImage = ssh `
            -i $sshKey `
            -o BatchMode=yes `
            xkh@localhost `
            "cat ~/user-center-deploy/.last_successful_image"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to read deployed version."
          }

          $actualImage = $actualImage.Trim()

          Write-Host "Expected image: $expectedImage"
          Write-Host "Actual image:   $actualImage"

          if ($actualImage -ne $expectedImage) {
              throw "Deployed image does not match current commit."
          }

          Write-Host "Deployed version verification passed."

      - name: External health check
        shell: powershell
        run: |
          for ($i = 1; $i -le 15; $i++) {
              try {
                  $response = Invoke-RestMethod `
                    -Uri "http://localhost:5000/health" `
                    -Method Get `
                    -TimeoutSec 5

                  if ($response.status -eq "ok") {
                      Write-Host "External health check passed."
                      exit 0
                  }
              }
              catch {
                  Write-Host "Health check attempt $i/15 failed."
              }

              Start-Sleep -Seconds 2
          }

          throw "External health check failed."
