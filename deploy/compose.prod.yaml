
services:
  mysql:
    image: mysql:8.0
    container_name: user-center-mysql

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped


  app:
    image: ${APP_IMAGE:-ghcr.io/whitedog628/user-center-testdev:latest}
    container_name: user-center-app

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


volumes:
  mysql_data:
